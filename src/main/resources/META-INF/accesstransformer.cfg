# The fields the effect system edits in place (design/effect.md): stacking and scaling change the instance the game is
# adding, and reading the hidden chain is how a held effect is found again.
public net.minecraft.world.effect.MobEffectInstance duration
public net.minecraft.world.effect.MobEffectInstance amplifier
public net.minecraft.world.effect.MobEffectInstance hiddenEffect
# The movement vector a client's input hands the game, which the movement event can empty only through this field, and
# the spell goal's inner class, which a mixin must name by a class literal (design/effect.md).
public net.minecraft.client.player.ClientInput moveVector
public net.minecraft.world.entity.monster.illager.SpellcasterIllager$SpellcasterUseSpellGoal
