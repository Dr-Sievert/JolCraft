# Dev-only mod that carries the game tests. The client, server and game-test runs load it (their
# loadedMods in build.gradle); the jar is built from the main source set only, so this never ships.
license="MIT"

[[mods]]
modId="jolcraft_gametest"
version="0.1"
displayName="JolCraft Game Tests"
description='''Game tests for JolCraft. Development runs only.'''

[[dependencies.jolcraft_gametest]]
modId="jolcraft"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="jolcraft.gametest.mixins.json"
