plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// Game tests live in their own source set and load as the dev-only mod jolcraft_gametest
// (src/gametest/resources/META-INF/neoforge.mods.toml). Every run loads it; the jar never does.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            sourceSet = sourceSets.gametest
        }

        client2 {
            client()
            sourceSet = sourceSets.gametest
            programArguments.addAll '--username', 'Dev2'
            gameDirectory = file('run/client2')
        }

        server {
            server()
            sourceSet = sourceSets.gametest
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = file('run/gametest')
        }

        data {
            clientData()
            gameDirectory = file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // No real terminal in IDE or Gradle consoles; skip JLine so the console appender stays quiet.
            systemProperty 'terminal.jline', 'false'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }

        "${mod_id}_gametest" {
            sourceSet(sourceSets.gametest)
        }
    }
}

// Datagen output. Gitignored; runData regenerates it.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

// ============================================================
// Optional integrations (integrations.properties)
// ============================================================
// Mods JolCraft integrates with but never requires. Each enabled one adds its artifacts to
// the named Gradle configurations (compileOnly APIs, localRuntime jars for the dev runs) and
// an optional [[dependencies]] entry to neoforge.mods.toml (${integration_dependencies}).

def integrationProperties = new Properties()
file('integrations.properties').withInputStream { integrationProperties.load(it) }

// name -> [enabled, modId, versionRange, side, artifacts: [[configuration, dependency], ...]]
def integrations = integrationProperties.stringPropertyNames()
        .collect { it.substring(0, it.indexOf('.')) }
        .unique().sort()
        .collectEntries { name ->
            def prop = { String key ->
                def value = integrationProperties.getProperty("${name}.${key}")
                if (!value?.trim()) {
                    throw new GradleException("integrations.properties: missing '${name}.${key}'")
                }
                value.trim()
            }
            def enabled = prop('enabled')
            if (!(enabled in ['true', 'false'])) {
                throw new GradleException("integrations.properties: '${name}.enabled' must be true or false")
            }
            def artifactNames = integrationProperties.stringPropertyNames()
                    .findAll { it.startsWith("${name}.artifact.") && it.endsWith('.dependency') }
                    .collect { it.tokenize('.')[2] }
                    .sort()
            [(name): [
                    enabled     : enabled.toBoolean(),
                    modId       : prop('modId'),
                    versionRange: prop('versionRange'),
                    side        : prop('side'),
                    artifacts   : artifactNames.collect {
                        [configuration: prop("artifact.${it}.configuration"), dependency: prop("artifact.${it}.dependency")]
                    }
            ]]
        }

def enabledIntegrations = integrations.values().findAll { it.enabled }

dependencies {
    enabledIntegrations.each { integration ->
        integration.artifacts.each { add(it.configuration, it.dependency) }
    }
}

def integrationDependenciesToml = enabledIntegrations.collect { integration ->
    """
[[dependencies.${mod_id}]]
modId="${integration.modId}"
type="optional"
versionRange="${integration.versionRange}"
ordering="NONE"
side="${integration.side}"
"""
}.join('')

// Expands src/main/templates (neoforge.mods.toml) with the properties above.
def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            integration_dependencies: integrationDependenciesToml
    ]

    inputs.properties replaceProperties
    expand replaceProperties

    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Ship the MIT text with the mod so redistributors have it.
tasks.named('jar', Jar) {
    from('LICENSE')
}
