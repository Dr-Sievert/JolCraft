# ============================================================
# JolCraft optional integrations
# ============================================================
#
# Mods JolCraft integrates with but never requires. Each one lists the Gradle artifacts for
# the development environment and the optional dependency that generateModMetadata writes
# into neoforge.mods.toml. Minecraft and NeoForge do not belong here (gradle.properties).
#
# <name>.enabled=true|false      false drops the mod from the dev runs and from mods.toml
# <name>.modId=<mod id>
# <name>.versionRange=<range>    the optional dependency's version range in mods.toml
# <name>.side=CLIENT|SERVER|BOTH
#
# Any number of artifacts per integration:
#
# <name>.artifact.<artifact>.configuration=<Gradle configuration>   compileOnly: API to compile
#                                                                   against; localRuntime: jar
#                                                                   loaded by the dev runs only
# <name>.artifact.<artifact>.dependency=<Maven coordinate>
#
# ============================================================


# ------------------------------------------------------------
# JEI (maven.blamejared.com)
# ------------------------------------------------------------

jei.enabled=true
jei.modId=jei
jei.versionRange=[29.47.0.111,)
jei.side=CLIENT

jei.artifact.commonApi.configuration=compileOnly
jei.artifact.commonApi.dependency=mezz.jei:jei-26.1.2-common-api:29.47.0.111

jei.artifact.neoforgeApi.configuration=compileOnly
jei.artifact.neoforgeApi.dependency=mezz.jei:jei-26.1.2-neoforge-api:29.47.0.111

jei.artifact.runtime.configuration=localRuntime
jei.artifact.runtime.dependency=mezz.jei:jei-26.1.2-neoforge:29.47.0.111

# ------------------------------------------------------------
# Jade (Modrinth maven)
# ------------------------------------------------------------

jade.enabled=true
jade.modId=jade
jade.versionRange=[26.1.12,)
jade.side=CLIENT

jade.artifact.api.configuration=compileOnly
jade.artifact.api.dependency=maven.modrinth:jade:26.1.12+neoforge@jar

jade.artifact.runtime.configuration=localRuntime
jade.artifact.runtime.dependency=maven.modrinth:jade:26.1.12+neoforge@jar
