# ============================================================
# JolCraft Optional Development Integrations
# ============================================================
#
# Integrations listed here may be present in the development
# environment for compilation and testing, but they are NEVER
# hard JolCraft dependencies.
#
# Minecraft and NeoForge do not belong here.
#
# Required integration properties:
#
# <name>.enabled=true|false
# <name>.modId=<mod id>
# <name>.versionRange=<NeoForge version range>
# <name>.side=CLIENT|SERVER|BOTH
#
# Each integration may expose any number of Gradle artifacts:
#
# <name>.artifact.<artifactName>.configuration=<configuration>
# <name>.artifact.<artifactName>.dependency=<Maven coordinate>
#
# ============================================================


# ------------------------------------------------------------
# JEI
# ------------------------------------------------------------

jei.enabled=true
jei.modId=jei
jei.versionRange=[19.39.0.371,)
jei.side=CLIENT

jei.artifact.commonApi.configuration=compileOnly
jei.artifact.commonApi.dependency=mezz.jei:jei-1.21.1-common-api:19.39.0.371

jei.artifact.neoforgeApi.configuration=compileOnly
jei.artifact.neoforgeApi.dependency=mezz.jei:jei-1.21.1-neoforge-api:19.39.0.371

jei.artifact.runtime.configuration=localRuntime
jei.artifact.runtime.dependency=mezz.jei:jei-1.21.1-neoforge:19.39.0.371


# ------------------------------------------------------------
# Jade
# ------------------------------------------------------------

jade.enabled=true
jade.modId=jade
jade.versionRange=[15.10.5,)
jade.side=CLIENT

jade.artifact.api.configuration=compileOnly
jade.artifact.api.dependency=maven.modrinth:jade:15.10.5+neoforge@jar

jade.artifact.runtime.configuration=localRuntime
jade.artifact.runtime.dependency=maven.modrinth:jade:15.10.5+neoforge@jar